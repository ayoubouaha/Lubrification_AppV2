spring.application.name=luberight-backend
server.port=8081

# Load local env properties for secrets (DB credentials).
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Auto-create cache tables on startup from schema.sql (idempotent T-SQL).
# The custom separator keeps the whole script as one batch so T-SQL
# IF...BEGIN...END blocks (which contain inner semicolons) are not split.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.separator=;;
spring.sql.init.continue-on-error=false

management.endpoints.web.exposure.include=health,info
